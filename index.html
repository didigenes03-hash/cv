<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="OBSIDIAN — Digital CV of a Vocational Student in Computer & Network Engineering. Available for Internship." />
<title>OBSIDIAN — Digital CV · TKJ Student</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2308090D'/%3E%3Ctext x='50' y='68' font-family='Sora' font-size='52' font-weight='700' fill='%2363D9FF' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E">
<style>
/* ===================== RESET ===================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 16px; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

:root {
  --obsidian: #08090D;
  --navy: #101522;
  --graphite: #1C2230;
  --pearl: #F3F5F8;
  --silver: #A1A8B5;
  --cyan: #63D9FF;
  --violet: #8C82FF;

  --bg: var(--obsidian);
  --bg-soft: var(--navy);
  --bg-elev: var(--graphite);
  --text: var(--pearl);
  --text-dim: var(--silver);
  --border: rgba(243,245,248,.08);
  --border-strong: rgba(243,245,248,.14);
  --accent: var(--cyan);
  --accent-2: var(--violet);
  --accent-glow: rgba(99,217,255,.35);

  --font-heading: 'Space Grotesk', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-display: 'Sora', system-ui, sans-serif;

  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 22px;
  --radius-xl: 32px;

  --nav-h: 68px;
  --ease: cubic-bezier(.22,.61,.36,1);
  --ease-out: cubic-bezier(.16,1,.3,1);
}

html[data-theme="light"] {
  --bg: #F4F5F8;
  --bg-soft: #ECEEF3;
  --bg-elev: #FFFFFF;
  --text: #0B0D14;
  --text-dim: #4A5160;
  --border: rgba(8,9,13,.08);
  --border-strong: rgba(8,9,13,.15);
  --accent-glow: rgba(99,217,255,.28);
}

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
  min-height: 100vh;
  transition: background .5s var(--ease), color .5s var(--ease);
}
body[data-reduced-motion="true"] * { animation: none !important; transition-duration: .001ms !important; }
body.loading { overflow: hidden; }

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
img { max-width: 100%; display: block; }
ul { list-style: none; }
::selection { background: var(--accent); color: var(--bg); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg-soft); }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* ===================== BACKGROUND ===================== */
.bg-layer { position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none; }
.bg-aurora {
  position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 20% 20%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 45%),
    radial-gradient(circle at 80% 30%, color-mix(in srgb, var(--accent-2) 18%, transparent), transparent 45%),
    radial-gradient(circle at 50% 90%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 50%);
  filter: blur(60px); opacity: .55;
  animation: auroraFloat 24s ease-in-out infinite;
}
html[data-theme="light"] .bg-aurora { opacity: .35; }
@keyframes auroraFloat {
  0%,100% { transform: translate(0,0) scale(1); }
  50% { transform: translate(-3%, 2%) scale(1.06); }
}
.bg-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(to right, var(--border) 1px, transparent 1px),
    linear-gradient(to bottom, var(--border) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%);
  opacity: .55;
}
.bg-noise {
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/%3E%3C/svg%3E");
  opacity: .035; mix-blend-mode: overlay;
  animation: noiseShift 8s steps(6) infinite;
}
@keyframes noiseShift { 0%{transform:translate(0,0)} 100%{transform:translate(-4%,-4%)} }
#particleCanvas { position: absolute; inset: 0; opacity: .5; }

/* ===================== CURSOR ===================== */
.cursor, .cursor-follower {
  position: fixed; pointer-events: none; z-index: 9999;
  border-radius: 50%; transform: translate(-50%,-50%);
  transition: opacity .3s, width .25s var(--ease), height .25s var(--ease);
  mix-blend-mode: difference;
}
.cursor { width: 8px; height: 8px; background: var(--pearl); }
.cursor-follower {
  width: 32px; height: 32px; border: 1.5px solid var(--pearl);
  transition: opacity .3s, width .35s var(--ease), height .35s var(--ease), background .25s;
}
.cursor.hover, .cursor-follower.hover {
  width: 48px; height: 48px; background: rgba(243,245,248,.1);
}
@media (hover: none) { .cursor, .cursor-follower { display: none; } }

/* ===================== LOADER ===================== */
.loader {
  position: fixed; inset: 0; z-index: 10000;
  background: var(--obsidian);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity .7s var(--ease-out), visibility .7s;
}
.loader.hide { opacity: 0; visibility: hidden; }
.loader-inner { text-align: center; padding: 20px; width: min(90%, 480px); }
.loader-logo { margin-bottom: 36px; overflow: hidden; }
.loader-logo-text {
  display: block;
  font-family: var(--font-display); font-size: clamp(2rem, 6vw, 3.4rem);
  font-weight: 800; letter-spacing: .18em; color: var(--pearl);
  animation: logoReveal 1.1s var(--ease-out) both;
}
.loader-logo-sub {
  display: block; margin-top: 8px;
  font-family: var(--font-heading); font-size: .68rem; letter-spacing: .5em;
  color: var(--silver); opacity: 0;
  animation: fadeUp .8s var(--ease-out) .5s both;
}
@keyframes logoReveal {
  0% { transform: translateY(120%); }
  100% { transform: translateY(0); }
}
@keyframes fadeUp { from { opacity:0; transform: translateY(10px);} to {opacity:1; transform:translateY(0);} }
.loader-bar {
  width: 100%; height: 2px; background: rgba(243,245,248,.08);
  border-radius: 2px; overflow: hidden; margin-bottom: 14px;
}
.loader-bar-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--cyan), var(--violet));
  transition: width .25s var(--ease);
}
.loader-status {
  display: flex; justify-content: space-between;
  font-size: .72rem; letter-spacing: .16em;
  color: var(--silver); text-transform: uppercase;
  font-family: var(--font-heading);
}
.sound-toggle {
  position: absolute; bottom: 32px; right: 32px;
  display: flex; align-items: center; gap: 8px;
  font-size: .68rem; letter-spacing: .16em; color: var(--silver);
  padding: 8px 14px; border-radius: 999px;
  border: 1px solid var(--border-strong);
  transition: all .3s var(--ease);
  font-family: var(--font-heading);
}
.sound-toggle:hover { color: var(--accent); border-color: var(--accent); }

/* ===================== SCROLL PROGRESS ===================== */
.scroll-progress {
  position: fixed; top: 0; left: 0; height: 2px; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  z-index: 9998; transition: width .1s linear;
}

/* ===================== NAVBAR ===================== */
.navbar {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  width: min(94%, 1180px); z-index: 900;
  transition: transform .4s var(--ease-out), top .3s;
}
.navbar.hidden { transform: translate(-50%, -140%); }
.nav-inner {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px 10px 20px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--bg) 65%, transparent);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--border-strong);
  box-shadow: 0 8px 32px rgba(0,0,0,.25);
}
html[data-theme="light"] .nav-inner { background: rgba(255,255,255,.7); box-shadow: 0 8px 32px rgba(8,9,13,.08); }
.nav-logo { display: flex; align-items: center; gap: 10px; }
.logo-mark {
  width: 30px; height: 30px; display: grid; place-items: center;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: var(--obsidian); font-family: var(--font-display);
  font-weight: 800; font-size: 1rem;
}
.logo-text {
  font-family: var(--font-heading); font-weight: 600;
  font-size: .82rem; letter-spacing: .22em; color: var(--text);
}
.nav-links { display: flex; gap: 4px; }
.nav-links a {
  position: relative; padding: 8px 14px; border-radius: 999px;
  font-size: .82rem; font-weight: 500; color: var(--text-dim);
  transition: color .25s;
}
.nav-links a:hover { color: var(--text); }
.nav-links a.active { color: var(--accent); }
.nav-links a.active::after {
  content: ""; position: absolute; left: 50%; bottom: 2px;
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--accent); transform: translateX(-50%);
  box-shadow: 0 0 12px var(--accent);
}
.nav-actions { display: flex; gap: 4px; align-items: center; }
.icon-btn {
  width: 36px; height: 36px; display: grid; place-items: center;
  border-radius: 50%; color: var(--text-dim);
  transition: all .25s var(--ease);
}
.icon-btn:hover { color: var(--accent); background: var(--border); }
.menu-toggle { display: none; width: 40px; height: 40px; position: relative; border-radius: 50%; }
.menu-toggle span {
  position: absolute; left: 50%; top: 50%; width: 18px; height: 1.5px;
  background: var(--text); transform: translate(-50%,-50%);
  transition: all .3s var(--ease);
}
.menu-toggle span:nth-child(1) { transform: translate(-50%,-6px); }
.menu-toggle span:nth-child(3) { transform: translate(-50%,6px); }
.menu-toggle.active span:nth-child(1) { transform: translate(-50%,-50%) rotate(45deg); }
.menu-toggle.active span:nth-child(2) { opacity: 0; }
.menu-toggle.active span:nth-child(3) { transform: translate(-50%,-50%) rotate(-45deg); }

/* ===================== MAIN / SECTIONS ===================== */
main { position: relative; }
.section {
  padding: clamp(80px, 12vh, 140px) 24px;
  max-width: 1240px; margin: 0 auto;
  position: relative;
}
.section-head { margin-bottom: clamp(40px, 6vh, 72px); max-width: 760px; }
.section-index {
  display: inline-block;
  font-family: var(--font-heading); font-size: .72rem;
  letter-spacing: .3em; color: var(--accent); margin-bottom: 18px;
}
.section-title {
  font-family: var(--font-heading); font-weight: 500;
  font-size: clamp(2rem, 5vw, 3.6rem); line-height: 1.08;
  letter-spacing: -.02em; color: var(--text);
}
.section-title em {
  font-style: italic; font-family: var(--font-display);
  font-weight: 300; color: var(--text-dim);
}
.section-sub {
  margin-top: 20px; color: var(--text-dim);
  font-size: 1rem; max-width: 560px;
}

/* ===================== HERO ===================== */
.hero {
  min-height: 100vh; display: flex; align-items: center;
  padding-top: calc(var(--nav-h) + 40px);
  position: relative;
}
.hero-inner {
  display: grid; grid-template-columns: 1.15fr 1fr;
  gap: clamp(40px, 6vw, 80px); align-items: center;
  width: 100%;
}
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--font-heading); font-size: .74rem;
  letter-spacing: .2em; color: var(--text-dim);
  text-transform: uppercase; margin-bottom: 24px;
  padding: 8px 14px; border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: color-mix(in srgb, var(--bg) 40%, transparent);
  backdrop-filter: blur(10px);
}
.dot-live {
  width: 7px; height: 7px; border-radius: 50%;
  background: #4ade80; box-shadow: 0 0 10px #4ade80;
  animation: dotPulse 2s ease-in-out infinite;
  display: inline-block;
}
@keyframes dotPulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

.hero-title {
  font-family: var(--font-heading); font-weight: 500;
  font-size: clamp(2.6rem, 7.5vw, 6rem);
  line-height: .95; letter-spacing: -.035em;
  margin-bottom: 28px;
}
.hero-title .line { display: block; }
.hero-title .line:nth-child(1) { color: var(--text-dim); font-size: .5em; font-weight: 400; margin-bottom: 4px; }
.gradient-text {
  background: linear-gradient(120deg, var(--text) 0%, var(--accent) 60%, var(--accent-2) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero-role {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  margin-bottom: 24px;
}
.role-tag {
  font-family: var(--font-heading); font-size: .7rem;
  letter-spacing: .24em; color: var(--text-dim);
  padding: 6px 12px; border-radius: 6px;
  border: 1px solid var(--border-strong);
}
.role-sep { color: var(--accent); }
.hero-headline {
  font-family: var(--font-display); font-weight: 300;
  font-size: clamp(1.05rem, 1.6vw, 1.32rem);
  line-height: 1.5; color: var(--text); margin-bottom: 18px;
  max-width: 560px;
}
.hero-desc {
  color: var(--text-dim); font-size: .95rem;
  max-width: 540px; margin-bottom: 40px;
}
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 44px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 13px 22px; border-radius: 999px;
  font-family: var(--font-heading); font-size: .84rem;
  font-weight: 500; letter-spacing: .01em;
  transition: all .3s var(--ease);
  position: relative; overflow: hidden;
  white-space: nowrap;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: var(--obsidian);
  box-shadow: 0 8px 24px -8px var(--accent-glow);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 32px -8px var(--accent-glow); }
.btn-ghost {
  color: var(--text); border: 1px solid var(--border-strong);
  background: color-mix(in srgb, var(--bg) 50%, transparent);
  backdrop-filter: blur(10px);
}
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
.btn.sm { padding: 10px 16px; font-size: .78rem; }
.btn.full { width: 100%; justify-content: center; }
.hero-meta {
  display: flex; flex-wrap: wrap; gap: clamp(20px, 4vw, 40px);
  padding-top: 28px; border-top: 1px solid var(--border);
}
.meta-item { display: flex; flex-direction: column; gap: 4px; }
.meta-label {
  font-family: var(--font-heading); font-size: .66rem;
  letter-spacing: .22em; color: var(--text-dim); text-transform: uppercase;
}
.meta-val { font-family: var(--font-heading); font-size: .9rem; font-weight: 500; }
.meta-val.available { display: flex; align-items: center; gap: 8px; }

/* HERO RIGHT / PROFILE */
.hero-right { position: relative; display: flex; flex-direction: column; align-items: center; gap: 20px; }
.profile-frame {
  position: relative; width: 100%; max-width: 420px;
  aspect-ratio: 4/5; border-radius: var(--radius-xl);
  padding: 12px;
  transform-style: preserve-3d;
  transition: transform .6s var(--ease-out);
}
.profile-glow {
  position: absolute; inset: -20%;
  background: radial-gradient(circle at 50% 50%, var(--accent-glow), transparent 60%);
  filter: blur(40px); z-index: -1; opacity: .8;
  animation: glowPulse 4s ease-in-out infinite;
}
@keyframes glowPulse { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
.profile-img-wrap {
  position: relative; width: 100%; height: 100%;
  border-radius: var(--radius-lg); overflow: hidden;
  border: 1px solid var(--border-strong);
  background: var(--bg-elev);
}
.profile-img { width: 100%; height: 100%; transition: transform .8s var(--ease-out); }
.profile-img svg { width: 100%; height: 100%; display: block; }
.profile-frame:hover .profile-img { transform: scale(1.04); }
.profile-badge {
  position: absolute; top: 16px; left: 16px;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; border-radius: 999px;
  background: rgba(8,9,13,.6);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(243,245,248,.15);
  font-family: var(--font-heading); font-size: .66rem;
  letter-spacing: .18em; color: var(--pearl);
  text-transform: uppercase;
}
.profile-chip {
  position: absolute; padding: 6px 12px; border-radius: 8px;
  font-family: var(--font-heading); font-size: .62rem;
  letter-spacing: .2em; color: var(--accent);
  background: rgba(8,9,13,.7); backdrop-filter: blur(10px);
  border: 1px solid var(--accent-glow);
  text-transform: uppercase; font-weight: 500;
}
.chip-1 { top: 50%; right: -18px; }
.chip-2 { bottom: 30%; left: -18px; color: var(--accent-2); border-color: rgba(140,130,255,.35); }
.chip-3 { bottom: 14%; right: -10px; color: var(--silver); border-color: var(--border-strong); }
.frame-corner {
  position: absolute; width: 18px; height: 18px;
  border: 1.5px solid var(--accent);
}
.frame-corner.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; border-radius: 6px 0 0 0; }
.frame-corner.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; border-radius: 0 6px 0 0; }
.frame-corner.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; border-radius: 0 0 0 6px; }
.frame-corner.br { bottom: -1px; right: -1px; border-left: none; border-top: none; border-radius: 0 0 6px 0; }
.hero-caption {
  display: flex; align-items: center; gap: 12px;
  font-family: var(--font-heading); font-size: .68rem;
  letter-spacing: .24em; color: var(--text-dim); text-transform: uppercase;
}
.caption-line { width: 32px; height: 1px; background: var(--text-dim); }

.scroll-indicator {
  position: absolute; bottom: 40px; left: 50%;
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  font-family: var(--font-heading); font-size: .62rem;
  letter-spacing: .3em; color: var(--text-dim); text-transform: uppercase;
}
.scroll-line {
  width: 1px; height: 40px; background: var(--text-dim);
  position: relative; overflow: hidden;
}
.scroll-line::after {
  content: ""; position: absolute; top: 0; left: 0;
  width: 100%; height: 50%; background: var(--accent);
  animation: scrollDrop 2s ease-in-out infinite;
}
@keyframes scrollDrop {
  0% { transform: translateY(-100%); }
  100% { transform: translateY(200%); }
}

/* ===================== REVEAL ANIMATION ===================== */
.reveal { opacity: 0; transform: translateY(30px); transition: opacity .9s var(--ease-out), transform .9s var(--ease-out); }
.reveal.in { opacity: 1; transform: translateY(0); }

/* ===================== ABOUT ===================== */
.about-grid {
  display: grid; grid-template-columns: 1fr 1.15fr;
  gap: clamp(40px, 6vw, 80px); align-items: start;
}
.about-frame {
  position: relative; border-radius: var(--radius-lg); overflow: hidden;
  border: 1px solid var(--border-strong);
}
.about-img { aspect-ratio: 4/5; background: var(--bg-elev); }
.about-img svg { width: 100%; height: 100%; }
.about-tag {
  position: absolute; bottom: 16px; left: 16px;
  padding: 8px 14px; border-radius: 999px;
  background: rgba(8,9,13,.7); backdrop-filter: blur(20px);
  border: 1px solid rgba(243,245,248,.15);
  font-family: var(--font-heading); font-size: .66rem;
  letter-spacing: .18em; color: var(--pearl); text-transform: uppercase;
}
.info-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 28px; }
.info-row {
  display
