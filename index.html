<!DOCTYPE html>
<html lang="id" data-theme="dark" data-accent="cyan">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBSIDIAN — Raka Pratama · Digital CV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Sora:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --obsidian:#08090D;--midnight:#101522;--graphite:#1C2230;
  --pearl:#F3F5F8;--silver:#A1A8B5;--cyan:#63D9FF;--violet:#8C82FF;
  --bg:var(--obsidian);--bg-alt:var(--midnight);
  --surface:rgba(28,34,48,.55);--surface-strong:rgba(28,34,48,.92);
  --border:rgba(161,168,181,.13);--border-hover:rgba(99,217,255,.4);
  --text:var(--pearl);--muted:var(--silver);
  --accent:var(--cyan);--accent2:var(--violet);
  --fh:'Space Grotesk',sans-serif;--fb:'Inter',sans-serif;--fd:'Sora',sans-serif;
  --r:18px;--rs:10px;
  --ease:cubic-bezier(.16,1,.3,1);
}
[data-theme="light"]{
  --bg:#F3F5F8;--bg-alt:#E8EBF0;
  --surface:rgba(255,255,255,.68);--surface-strong:rgba(255,255,255,.94);
  --border:rgba(28,34,48,.11);--text:#101522;--muted:#5A6274;
}
[data-accent="violet"]{--accent:#8C82FF;--accent2:#63D9FF}
[data-motion="reduced"] *{animation-duration:.001ms!important;transition-duration:.001ms!important}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--fb);background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;transition:background .5s var(--ease),color .5s var(--ease);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
img{max-width:100%;display:block}
h1,h2,h3,h4{font-family:var(--fh);font-weight:600;line-height:1.15;letter-spacing:-.02em}
::selection{background:var(--accent);color:var(--obsidian)}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--graphite);border-radius:8px}
.container{width:min(1180px,92vw);margin-inline:auto}
.section{padding:clamp(70px,10vh,120px) 0;position:relative}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:clamp(36px,5vw,60px)}
.section-head h2{font-size:clamp(1.9rem,4vw,3rem);font-weight:700}
.idx{color:var(--accent);font-family:var(--fh);font-size:.75rem;letter-spacing:.22em;display:block;margin-bottom:8px}
.section-head p{color:var(--muted);max-width:360px;font-size:.9rem}
.glass{background:var(--surface);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid var(--border);border-radius:var(--r)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:100px;font-size:.88rem;font-weight:500;transition:all .35s var(--ease);border:1px solid transparent;white-space:nowrap}
.btn-primary{background:var(--accent);color:var(--obsidian);box-shadow:0 8px 26px rgba(99,217,255,.22)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 12px 36px rgba(99,217,255,.38)}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-3px)}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:all .3s var(--ease)}
.icon-btn:hover{color:var(--accent);background:rgba(99,217,255,.08)}

/* LOADER */
#loader{position:fixed;inset:0;z-index:9999;background:var(--obsidian);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s var(--ease),visibility .6s}
#loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loader-logo{font-family:var(--fd);font-weight:800;font-size:clamp(2.6rem,9vw,5rem);letter-spacing:-.04em;background:linear-gradient(135deg,var(--pearl),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .8s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.loader-bar{width:min(220px,60vw);height:2px;background:var(--graphite);margin-top:26px;border-radius:2px;overflow:hidden}
.loader-bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .18s linear}

/* NAV */
.scroll-progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:1000;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .1s linear}
#navbar{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:900;width:min(1160px,94vw);display:flex;align-items:center;justify-content:space-between;padding:9px 12px 9px 20px;border-radius:100px;background:rgba(16,21,34,.6);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--border);transition:transform .45s var(--ease),background .4s}
[data-theme="light"] #navbar{background:rgba(255,255,255,.7)}
#navbar.hide{transform:translateX(-50%) translateY(-140%)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--fd);font-weight:700;font-size:1rem}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.nav-links{display:flex;gap:2px}
.nav-link{position:relative;padding:8px 13px;border-radius:100px;font-size:.8rem;font-weight:500;color:var(--muted);transition:color .3s}
.nav-link::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:0;height:1.5px;background:var(--accent);transition:width .3s var(--ease)}
.nav-link.active,.nav-link:hover{color:var(--text)}
.nav-link.active::after{width:16px}
.nav-actions{display:flex;gap:4px}
.mobile-menu-btn{display:none}
#mobileMenu{position:fixed;inset:0;z-index:850;background:rgba(8,9,13,.94);backdrop-filter:blur(30px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;opacity:0;visibility:hidden;transition:all .45s var(--ease)}
[data-theme="light"] #mobileMenu{background:rgba(243,245,248,.96)}
#mobileMenu.open{opacity:1;visibility:visible}
#mobileMenu a{font-family:var(--fh);font-size:1.7rem;font-weight:600;padding:10px 20px;color:var(--muted);transition:color .3s}
#mobileMenu a:hover{color:var(--accent)}
#mobileMenu .close{position:absolute;top:24px;right:24px}
.settings-panel{position:fixed;top:86px;right:16px;z-index:800;width:250px;padding:18px;border-radius:var(--r);background:var(--surface-strong);backdrop-filter:blur(24px);border:1px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.4);opacity:0;visibility:hidden;transform:translateY(-8px);transition:all .35s var(--ease)}
.settings-panel.open{opacity:1;visibility:visible;transform:translateY(0)}
.settings-panel h5{font-family:var(--fh);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:.8rem}
.set-row .lbl{color:var(--muted)}
.theme-toggle{width:44px;height:24px;border-radius:100px;background:var(--graphite);position:relative;transition:background .3s}
.theme-toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--pearl);transition:transform .32s var(--ease)}
[data-theme="light"] .theme-toggle{background:var(--accent)}
[data-theme="light"] .theme-toggle::after{transform:translateX(20px);background:var(--obsidian)}
.accent-dots{display:flex;gap:8px}
.accent-dot{width:20px;height:20px;border-radius:50%;border:2px solid transparent;transition:all .2s}
.accent-dot[data-accent="cyan"]{background:var(--cyan)}
.accent-dot[data-accent="violet"]{background:var(--violet)}
.accent-dot.active{border-color:var(--pearl);transform:scale(1.15)}
.mini-switch{width:38px;height:21px;border-radius:100px;background:var(--graphite);position:relative;transition:background .3s}
.mini-switch::after{content:'';position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:var(--pearl);transition:transform .3s var(--ease)}
.mini-switch.on{background:var(--accent)}
.mini-switch.on::after{transform:translateX(17px)}

/* HERO */
#home{min-height:100vh;display:flex;align-items:center;position:relative;overflow:hidden;padding-top:80px}
.hero-bg{position:absolute;inset:0;z-index:-2;background:radial-gradient(ellipse 60% 50% at 70% 20%,rgba(99,217,255,.1),transparent 60%),radial-gradient(ellipse 50% 60% at 20% 80%,rgba(140,130,255,.09),transparent 60%),radial-gradient(ellipse 80% 60% at 50% 50%,rgba(28,34,48,.45),transparent)}
.hero-grid{position:absolute;inset:0;z-index:-1;opacity:.4;background-image:linear-gradient(rgba(161,168,181,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(161,168,181,.055) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 70% 70% at 50% 40%,#000 20%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 40%,#000 20%,transparent 70%)}
.hero-content{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(30px,5vw,70px);align-items:center;padding:50px 0 40px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 15px;border-radius:100px;background:rgba(99,217,255,.08);border:1px solid rgba(99,217,255,.22);color:var(--accent);font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:24px}
.hero-badge .pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(99,217,255,.6)}50%{box-shadow:0 0 0 7px rgba(99,217,255,0)}}
.hero-name{font-family:var(--fd);font-weight:800;font-size:clamp(2.6rem,6.5vw,5rem);line-height:.95;letter-spacing:-.04em;margin-bottom:14px}
.hero-name .accent{color:var(--accent)}
.hero-label{font-family:var(--fh);font-size:.75rem;letter-spacing:.25em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.hero-major{font-family:var(--fh);font-size:.82rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:24px}
.hero-headline{font-size:clamp(1.05rem,2vw,1.3rem);font-weight:500;max-width:480px;margin-bottom:12px;line-height:1.4}
.hero-desc{color:var(--muted);max-width:450px;font-size:.92rem;margin-bottom:30px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:34px}
.hero-meta{display:flex;gap:22px;flex-wrap:wrap}
.hero-meta-item{display:flex;align-items:center;gap:7px;font-size:.78rem;color:var(--muted)}
.hero-meta-item svg{width:15px;height:15px;color:var(--accent)}
.hero-visual{display:flex;justify-content:center;align-items:center;position:relative}
.profile-frame{position:relative;width:clamp(250px,32vw,380px);aspect-ratio:4/5;border-radius:26px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 70px rgba(99,217,255,.1);border:1px solid var(--border);transition:transform .3s var(--ease)}
.profile-frame img{width:100%;height:100%;object-fit:cover}
.profile-frame::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(8,9,13,.72));pointer-events:none}
.frame-tag{position:absolute;bottom:16px;left:16px;z-index:2;display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:100px;background:rgba(8,9,13,.6);backdrop-filter:blur(12px);border:1px solid var(--border);font-size:.7rem;color:var(--pearl)}
.frame-tag .dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 10px #4ade80}
.float-geo{position:absolute;border:1px solid var(--border);border-radius:14px;background:var(--surface);backdrop-filter:blur(8px);animation:floatY 6s ease-in-out infinite;pointer-events:none}
.float-geo.g1{width:64px;height:64px;top:8%;right:-5%;animation-delay:0s}
.float-geo.g2{width:42px;height:42px;bottom:14%;left:-7%;border-radius:50%;animation-delay:1.5s;border-color:rgba(140,130,255,.3)}
.float-geo.g3{width:30px;height:30px;top:42%;right:-10%;animation-delay:3s;transform:rotate(45deg);border-color:rgba(99,217,255,.3)}
@keyframes floatY{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(6deg)}}
.scroll-hint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:.65rem;letter-spacing:.22em;animation:floatY 3s ease-in-out infinite}
.scroll-hint .line{width:1px;height:36px;background:linear-gradient(var(--accent),transparent)}

/* ABOUT */
.about-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(30px,5vw,60px);align-items:start}
.about-photo{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:3/4;border:1px solid var(--border)}
.about-photo img{width:100%;height:100%;object-fit:cover}
.stamp{position:absolute;top:14px;right:14px;padding:6px 11px;border-radius:8px;background:rgba(8,9,13,.6);backdrop-filter:blur(10px);border:1px solid var(--border);font-family:var(--fh);font-size:.62rem;letter-spacing:.12em;color:var(--accent)}
.about-text h3{font-size:clamp(1.6rem,3vw,2.2rem);margin-bottom:16px}
.lead{color:var(--muted);font-size:.98rem;margin-bottom:20px;max-width:540px}
.about-bio{color:var(--muted);font-size:.9rem;margin-bottom:14px;max-width:540px}
.bio-extra{max-height:0;overflow:hidden;transition:max-height .5s var(--ease)}
.bio-extra.open{max-height:300px}
.bio-toggle{margin:6px 0 24px;color:var(--accent);font-size:.8rem;display:inline-flex;align-items:center;gap:6px}
.bio-toggle svg{width:15px;height:15px;transition:transform .3s}
.bio-toggle.open svg{transform:rotate(180deg)}
.info-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin-bottom:24px}
.info-card{padding:15px;border-radius:var(--rs);background:var(--surface);border:1px solid var(--border);transition:all .35s var(--ease)}
.info-card:hover{border-color:var(--border-hover);transform:translateY(-3px)}
.info-card .lbl{font-size:.62rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:5px;font-family:var(--fh)}
.info-card .val{font-size:.85rem;font-weight:500}
.quote-box{padding:20px 24px;border-radius:var(--r);background:linear-gradient(135deg,rgba(99,217,255,.06),rgba(140,130,255,.06));border:1px solid var(--border);position:relative}
.quote-box p{font-size:.92rem;font-style:italic;color:var(--text)}
.quote-box .author{margin-top:8px;font-size:.75rem;color:var(--muted);font-style:normal}

/* ID CARD */
.id-card{max-width:700px;margin:0 auto;border-radius:24px;padding:2px;background:linear-gradient(135deg,rgba(99,217,255,.4),rgba(140,130,255,.2),transparent 60%);animation:borderShift 6s linear infinite}
@keyframes borderShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.id-inner{background:var(--surface-strong);backdrop-filter:blur(24px);border-radius:22px;padding:clamp(22px,4vw,40px);border:1px solid var(--border);position:relative;overflow:hidden}
.id-inner::before{content:'';position:absolute;top:-50%;right:-20%;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(99,217,255,.12),transparent 70%);pointer-events:none}
.id-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px;padding-bottom:20px;border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap}
.id-header .title{font-family:var(--fh);font-size:.66rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.id-header .name{font-family:var(--fd);font-weight:700;font-size:1.05rem;margin-top:4px}
.id-badge{padding:6px 11px;border-radius:100px;background:rgba(99,217,255,.1);border:1px solid rgba(99,217,255,.25);color:var(--accent);font-size:.62rem;letter-spacing:.1em;font-family:var(--fh);white-space:nowrap}
.id-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px}
.id-field .lbl{font-size:.62rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:4px;font-family:var(--fh)}
.id-field .val{font-size:.88rem;font-weight:500;display:flex;align-items:center;gap:9px;word-break:break-word}
.id-field .val.blurred{filter:blur(5px);user-select:none;pointer-events:none}
.copy-btn{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:rgba(99,217,255,.1);color:var(--accent);flex-shrink:0;opacity:0;transition:opacity .2s}
.id-field:hover .copy-btn{opacity:1}
.copy-btn svg{width:12px;height:12px}
.id-footer{display:flex;justify-content:space-between;align-items:center;margin-top:26px;padding-top:18px;border-top:1px solid var(--border);flex-wrap:wrap;gap:12px}
.privacy-toggle{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--muted)}
.switch{width:40px;height:22px;border-radius:100px;background:var(--graphite);position:relative;transition:background .3s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--pearl);transition:transform .3s var(--ease)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px)}

/* TIMELINE */
.timeline{position:relative;max-width:780px;margin:0 auto;padding-left:36px}
.timeline::before{content:'';position:absolute;left:10px;top:0;bottom:0;width:1px;background:linear-gradient(var(--accent),var(--violet),transparent)}
.tl-item{position:relative;margin-bottom:30px}
.tl-item:last-child{margin-bottom:0}
.tl-node{position:absolute;left:-30px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--bg);border:2px solid var(--accent);box-shadow:0 0 0 4px rgba(99,217,255,.1);transition:all .3s var(--ease)}
.tl-item:hover .tl-node{background:var(--accent);box-shadow:0 0 0 6px rgba(99,217,255,.2),0 0 20px var(--accent)}
.tl-card{padding:20px 24px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);transition:all .35s var(--ease);cursor:pointer}
.tl-card:hover{border-color:var(--border-hover);transform:translateX(4px)}
.tl-year{font-family:var(--fh);font-size:.68rem;letter-spacing:.12em;color:var(--accent);margin-bottom:5px}
.tl-card h4{font-size:1.05rem;margin-bottom:3px}
.tl-school{color:var(--muted);font-size:.82rem;margin-bottom:8px}
.tl-detail{max-height:0;overflow:hidden;transition:max-height .45s var(--ease)}
.tl-detail.open{max-height:200px}
.tl-detail p{color:var(--muted);font-size:.82rem;padding-top:10px;border-top:1px solid var(--border);margin-top:6px}

/* SKILLS */
.skills-controls{display:flex;gap:11px;flex-wrap:wrap;align-items:center;margin-bottom:26px}
.search-box{display:flex;align-items:center;gap:9px;padding:9px 16px;border-radius:100px;background:var(--surface);border:1px solid var(--border);transition:border-color .3s;min-width:200px;flex:1;max-width:300px}
.search-box:focus-within{border-color:var(--accent)}
.search-box input{background:none;border:0;outline:0;color:var(--text);font-size:.82rem;width:100%;font-family:var(--fb)}
.search-box svg{width:15px;height:15px;color:var(--muted);flex-shrink:0}
.filter-chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:7px 16px;border-radius:100px;font-size:.75rem;font-weight:500;background:var(--surface);border:1px solid var(--border);color:var(--muted);transition:all .3s var(--ease)}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.active{background:var(--accent);color:var(--obsidian);border-color:var(--accent)}
.skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:13px}
.skill-card{padding:18px;border-radius:var(--rs);background:var(--surface);border:1px solid var(--border);transition:all .35s var(--ease);position:relative;overflow:hidden;cursor:pointer}
.skill-card:hover{border-color:var(--border-hover);transform:translateY(-4px);box-shadow:0 0 30px rgba(99,217,255,.08)}
.skill-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;ga
